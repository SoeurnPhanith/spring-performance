version: "3.8"

services:

  # PostgreSQL container
  postgres:
    image: postgres:17
    container_name: pg-db
    environment:
      POSTGRES_DB: db_student
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres@168"
    ports:
      - "5432:5432"

  # PostgreSQL UI
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      # access UI on http://localhost:5050
      - "5050:80"
    depends_on:
      - postgres

  # Redis container
  redis:
    image: redis:7
    container_name: redis-cache
    ports:
      - "6380:6379"

  # Redis UI
  redisinsight:
    image: redislabs/redisinsight
    container_name: redisinsight
    ports:
      - "8888:8001"
    depends_on:
      - redis

  # Spring Boot container
  app:
    build: .
    container_name: spring-boot-api
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_student
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "postgres@168"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8080:8080"